[package]
name = "dfjni"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "DeepFilterNet3 noise suppression JNI bindings for the Jitsi Meet Android SDK"

[lib]
# cdylib for the Android .so, rlib so host `cargo test` can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# deep_filter 0.5.x is not published on crates.io; pin the v0.5.6 release tag.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
jni = "0.21"
anyhow = "1"
ndarray = "0.15"

[profile.release]
lto = true
opt-level = 3
strip = "symbols"
